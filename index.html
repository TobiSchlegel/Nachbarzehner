<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nachbarzehner</title>
<style>
:root{--bg:#fff8e1;--card:#ffffff;--ink:#2b2b2b;--line:#444;--ok:#43a047;--okbg:#c8f0cc;--bad:#e53935;--badbg:#ffcdd2;--accent:#1e88e5;--box:#fffde7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2433;--card:#2a3347;--ink:#f3f3f3;--line:#ddd;--okbg:#27502b;--badbg:#5c2424;--box:#3a4560}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Comic Neue",Calibri,"Segoe UI",sans-serif;padding:12px}
h1{text-align:center;margin:8px 0 2px;font-size:2rem}
.sub{text-align:center;margin:0 0 12px;font-size:1rem}
.wrap{max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:10px 12px 12px;margin-bottom:12px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.top{display:flex;align-items:center;justify-content:center;gap:8px}
.top input{width:68px;height:52px;font:inherit;font-size:1.5rem;text-align:center;border:3px solid var(--line);border-radius:12px;background:var(--box);color:var(--ink)}
.top input.ok{border-color:var(--ok);background:var(--okbg)}
.top input.bad{border-color:var(--bad);background:var(--badbg)}
.num{font-size:2.2rem;font-weight:bold;min-width:76px;text-align:center;border:3px solid var(--line);border-radius:12px;padding:2px 6px;background:var(--card)}
.lt{font-size:1.5rem}
svg{width:100%;height:auto;display:block;border:2px solid var(--line);border-radius:10px;margin-top:8px;touch-action:none;cursor:pointer;background:var(--box)}
svg.ok{background:var(--okbg);border-color:var(--ok)}
svg.bad{background:var(--badbg);border-color:var(--bad)}
.fine{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.fine button{font:inherit;font-size:1.2rem;width:52px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.fine span{min-width:120px;text-align:center}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 30px}
.bar button{font:inherit;font-size:1.3rem;padding:12px 22px;border:none;border-radius:16px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#check{background:var(--ok)}#again{background:var(--accent)}
#msg{text-align:center;font-size:1.4rem;min-height:2em;margin:6px 0}
#win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:5;align-items:center;justify-content:center}
#win div{background:var(--card);border-radius:24px;padding:28px 34px;text-align:center;font-size:1.6rem;max-width:88%}
#win button{font:inherit;font-size:1.2rem;margin-top:14px;padding:10px 20px;border:none;border-radius:14px;background:var(--accent);color:#fff}
canvas{position:fixed;inset:0;pointer-events:none;z-index:6}
</style>
</head>
<body>
<div class="wrap">
<h1>🔢 Nachbarzehner</h1>
<p class="sub">Schreibe die Nachbarzehner in die Kästchen und tippe die Zahl auf dem Zahlenstrahl an.</p>
<div id="list"></div>
<div id="msg"></div>
<div class="bar"><button id="again">🎲 Neue Runde</button></div>
</div>
<div id="win"><div>🎉 Super gemacht! 🎉<br>Alle 12 Aufgaben sind richtig!<br><button onclick="newRound()">Neue Runde</button></div></div>
<canvas id="cv"></canvas>
<script>
const N=12;let tasks=[];
const $=s=>document.querySelector(s);
const X=v=>15+v*5;
function newRound(){
  const pool=[];for(let i=1;i<100;i++)if(i%10)pool.push(i);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  tasks=pool.slice(0,N).map(n=>({n,mark:null}));
  $('#win').style.display='none';$('#msg').textContent='';
  render();window.scrollTo(0,0);
}
function ticks(){
  let s='';
  for(let v=0;v<=100;v++){
    const h=v%10==0?22:v%5==0?15:8;
    s+=`<line x1="${X(v)}" x2="${X(v)}" y1="50" y2="${50-h}" stroke="currentColor" stroke-width="${v%10==0?2:1}"/>`;
    if(v%10==0)s+=`<text x="${X(v)}" y="18" text-anchor="middle" font-size="14" fill="currentColor">${v}</text>`;
  }
  return s+`<line x1="15" x2="515" y1="50" y2="50" stroke="currentColor" stroke-width="2"/>`;
}
function render(){
  const L=$('#list');L.innerHTML='';
  tasks.forEach((t,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="top"><input inputmode="numeric" maxlength="3" id="lo${i}" aria-label="Zehner davor"><span class="lt">&lt;</span><div class="num">${t.n}</div><span class="lt">&lt;</span><input inputmode="numeric" maxlength="3" id="hi${i}" aria-label="Zehner danach"></div>
    <svg id="sv${i}" viewBox="0 0 530 90" style="color:var(--ink)">${ticks()}<g id="mk${i}"></g></svg>
    <div class="fine"><button aria-label="eins zurück">◀</button><span id="lb${i}">Tippe auf den Strahl</span><button aria-label="eins weiter">▶</button></div>`;
    L.appendChild(c);
    const sv=c.querySelector('svg');
    const setFrom=e=>{const r=sv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*530;setMark(i,Math.round((x-15)/5));};
    let drag=false;
    sv.addEventListener('pointerdown',e=>{drag=true;sv.setPointerCapture(e.pointerId);setFrom(e);});
    sv.addEventListener('pointermove',e=>{if(drag)setFrom(e);});
    sv.addEventListener('pointerup',()=>{drag=false;evalTask(i);});
    const b=c.querySelectorAll('.fine button');
    b[0].onclick=()=>{setMark(i,(tasks[i].mark??tasks[i].n)-1);evalTask(i);};
    b[1].onclick=()=>{setMark(i,(tasks[i].mark??tasks[i].n)+1);evalTask(i);};
    c.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>evalTask(i)));
  });
}
function setMark(i,v){
  v=Math.max(0,Math.min(100,v));tasks[i].mark=v;clearState(i);
  const x=X(v);
  $('#mk'+i).innerHTML=`<line x1="${x}" x2="${x}" y1="8" y2="50" stroke="#1e88e5" stroke-width="3"/><polygon points="${x-9},84 ${x+9},84 ${x},56" fill="#1e88e5"/>`;
  $('#lb'+i).textContent='Dein Strich: '+v;
}
function clearState(i){
  ['lo','hi'].forEach(p=>$('#'+p+i).className='');
  $('#sv'+i).setAttribute('class','');
}
function evalTask(i){
  const t=tasks[i],lo=String(Math.floor(t.n/10)*10),hi=String(Math.floor(t.n/10)*10+10);
  const st=(el,exp)=>{const v=el.value.trim();el.className=!v?'':v===exp?'ok':(v.length>=exp.length||!exp.startsWith(v))?'bad':'';};
  st($('#lo'+i),lo);st($('#hi'+i),hi);
  $('#sv'+i).setAttribute('class',t.mark===null?'':t.mark===t.n?'ok':'bad');
  summary();
}
function summary(){
  let good=0;
  tasks.forEach((t,i)=>{if($('#lo'+i).className==='ok'&&$('#hi'+i).className==='ok'&&$('#sv'+i).getAttribute('class')==='ok')good++;});
  $('#msg').textContent=good?`${good} von ${N} richtig ⭐`:'';
  if(good===N&&$('#win').style.display!=='flex')win();
}
function applause(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const len=Math.floor(ac.sampleRate*0.05),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    for(let k=0;k<140;k++){
      const t=ac.currentTime+Math.random()*3.2*(0.4+Math.random()*0.6);
      const s=ac.createBufferSource();s.buffer=buf;s.playbackRate.value=0.7+Math.random()*0.8;
      const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1200+Math.random()*2500;f.Q.value=0.8;
      const g=ac.createGain();g.gain.value=0.35+Math.random()*0.5;
      s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);
    }
  }catch(e){}
}
function confetti(){
  const cv=$('#cv'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const ps=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,v:2+Math.random()*4,c:`hsl(${Math.random()*360},85%,55%)`,s:6+Math.random()*8}));
  let f=0;(function loop(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s);});
    if(++f<260)requestAnimationFrame(loop);else x.clearRect(0,0,cv.width,cv.height);})();
}
function win(){$('#win').style.display='flex';applause();confetti();}
$('#again').onclick=newRound;
newRound();
</script>
</body>
</html>
